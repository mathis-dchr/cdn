name: Build and push

on:
  workflow_dispatch: # bouton sur l'interface Actions de GitHub
      inputs:
        tag_name:
          description: 'Tag de version personnalisé, laisser vide pour auto-incrémentation.'
          required: false
          default: ''
  push:
    branches:
      - main
    paths:  # Le workflow ne s'exécutera que si un de ces fichiers est modifié
      - 'surrogate/Dockerfile'
      - 'surrogate/code/requirements.txt'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }} # tag manuel
            type=raw,value=v${{ github.run_number }},enable=${{ inputs.tag_name == '' }} # tag avec incrémentation automatique
            type=raw,value=latest # conserve toujours un tag 'latest' à jour

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: surrogate
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
