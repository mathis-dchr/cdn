frr version 10.2.1_git
frr defaults traditional
hostname cdn-jp
domainname localdomain
no ipv6 forwarding
!
interface eth1
 description vers r2-jp:eth2
 ip address 30.20.2.2/24
exit
!
interface eth2
 description lb-jp (anycast)
 ip address 10.0.0.30/24
exit
!
interface eth3
 description VPN surrogates JP
 ip address 30.40.1.1/24
exit
!
interface eth4
 description vers isp-jp:eth2
 ip address 30.30.3.2/24
exit
!
router bgp 3040
 bgp router-id 10.255.30.40
 no bgp default ipv4-unicast
 neighbor 30.20.2.1 remote-as 3020
 neighbor 30.20.2.1 description r2-jp
 neighbor 30.30.3.1 remote-as 3030
 neighbor 30.30.3.1 description isp-jp
 !
 address-family ipv4 unicast
  network 10.0.0.0/24
  network 30.20.2.0/24
  network 30.30.3.0/24
  network 30.40.1.0/24
  neighbor 30.20.2.1 activate
  neighbor 30.20.2.1 route-map RM-IN in
  neighbor 30.20.2.1 route-map RM-OUT out
  neighbor 30.30.3.1 activate
  neighbor 30.30.3.1 route-map RM-IN in
  neighbor 30.30.3.1 route-map RM-OUT out
 exit-address-family
exit
!
route-map RM-IN permit 10
exit
!
route-map RM-OUT permit 10
exit
!
