frr version 10.2.1_git
frr defaults traditional
hostname isp-jp
domainname localdomain
no ipv6 forwarding
!
interface eth1
 description vers r2-jp:eth3
 ip address 30.20.1.2/24
exit
!
interface eth2
 description vers cdn-jp:eth4
 ip address 30.30.3.1/24
exit
!
interface eth3
 description u1-jp
 ip address 30.30.1.1/24
exit
!
interface eth4
 description u2-jp
 ip address 30.30.2.1/24
exit
!
router bgp 3030
 bgp router-id 10.255.30.30
 no bgp default ipv4-unicast
 neighbor 30.20.1.1 remote-as 3020
 neighbor 30.20.1.1 description r2-jp
 neighbor 30.30.3.2 remote-as 3040
 neighbor 30.30.3.2 description cdn-jp
 !
 address-family ipv4 unicast
  network 30.20.1.0/24
  network 30.30.1.0/24
  network 30.30.2.0/24
  network 30.30.3.0/24
  neighbor 30.20.1.1 activate
  neighbor 30.20.1.1 route-map RM-IN in
  neighbor 30.20.1.1 route-map RM-OUT out
  neighbor 30.30.3.2 activate
  neighbor 30.30.3.2 route-map RM-IN in
  neighbor 30.30.3.2 route-map RM-OUT out
 exit-address-family
exit
!
route-map RM-IN permit 10
exit
!
route-map RM-OUT permit 10
exit
!
