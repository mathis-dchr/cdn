frr version 10.2.1_git
frr defaults traditional
hostname r2-jp
domainname localdomain
no ipv6 forwarding
!
interface eth1
 description vers r1:eth3
 ip address 30.10.1.2/24
exit
!
interface eth2
 description vers cdn-jp:eth1
 ip address 30.20.2.1/24
exit
!
interface eth3
 description vers isp-jp:eth1
 ip address 30.20.1.1/24
exit
!
interface eth4
 description vers r2-fr:eth4
 ip address 20.20.3.2/24
exit
!
router bgp 3020
 bgp router-id 10.255.30.20
 no bgp default ipv4-unicast
 neighbor 20.20.3.1 remote-as 2020
 neighbor 20.20.3.1 description r2-fr
 neighbor 30.10.1.1 remote-as 10
 neighbor 30.10.1.1 description r1
 neighbor 30.20.1.2 remote-as 3030
 neighbor 30.20.1.2 description isp-jp
 neighbor 30.20.2.2 remote-as 3040
 neighbor 30.20.2.2 description cdn-jp
 !
 address-family ipv4 unicast
  network 20.20.3.0/24
  network 30.10.1.0/24
  network 30.20.1.0/24
  network 30.20.2.0/24
  neighbor 20.20.3.1 activate
  neighbor 20.20.3.1 route-map RM-IN in
  neighbor 20.20.3.1 route-map RM-OUT out
  neighbor 30.10.1.1 activate
  neighbor 30.10.1.1 route-map RM-IN in
  neighbor 30.10.1.1 route-map RM-OUT out
  neighbor 30.20.1.2 activate
  neighbor 30.20.1.2 route-map RM-IN in
  neighbor 30.20.1.2 route-map RM-OUT out
  neighbor 30.20.2.2 activate
  neighbor 30.20.2.2 route-map RM-IN in
  neighbor 30.20.2.2 route-map RM-OUT out
 exit-address-family
exit
!
route-map RM-IN permit 10
exit
!
route-map RM-OUT permit 10
exit
!
